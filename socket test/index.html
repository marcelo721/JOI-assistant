<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEVA MQTT Tester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #d1d5db;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            font-size: 15px;
        }

        input,
        textarea {
            background: #374151;
            color: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            background: #374151;
            margin-bottom: 15px;
        }

        #logs {
            background: #111827;
            padding: 15px;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NEVA MQTT Tester</h1>

    <div class="subtitle">
        Simulador de ESP32 para testar o chat e o TTS
    </div>

    <div class="card">

        <h2>MQTT</h2>

        <label>Broker WebSocket</label>

        <input
            id="broker"
            value="ws://localhost:9001"
            placeholder="ws://localhost:9001"
        >

        <label>Device ID</label>

        <input
            id="deviceId"
            value="1"
        >

        <button onclick="connectMQTT()">
            Conectar
        </button>

        <div id="status" class="status">
            🔴 Desconectado
        </div>

    </div>

    <div class="card">

        <h2>Enviar mensagem</h2>

        <label>Mensagem</label>

        <textarea
            id="message"
            placeholder="Digite uma mensagem para a NEVA..."
        ></textarea>

        <button onclick="sendMessage()">
            Enviar para NEVA
        </button>

    </div>

    <div class="card">

        <h2>Logs</h2>

        <div id="logs"></div>

    </div>

</div>

<!-- MQTT.js -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script src="app.js"></script>

</body>
</html>
